    <script>
      (() => {

        let link = document.head.querySelector('link[rel="canonical"]');
        if (!link) {
          link = document.createElement("link");
          link.rel = "canonical";
          document.head.append(link);
        }
        link.href = canonical;
        const image = document.head.querySelector('meta[property="og:image"]');
        const imageUrl = image ? new URL(image.content, window.location.origin).href : "";
        const urlMeta = document.head.querySelector('meta[property="og:url"]');
        if (urlMeta) urlMeta.content = canonical;
        if (image) image.content = imageUrl;

        const metadata = {
          "@context": "https://schema.org",
          "@type": "WebPage",
          name: document.title,
          description:
            document.head.querySelector('meta[name="description"]')?.content ?? "",

            sameAs: [
              "https://github.com/vandit0703",
              "https://linkedin.com/in/katbamna-vandit-115122327",
            ],
          },
          ...(window.location.pathname.startsWith("/projects/")
            ? {
                breadcrumb: {
                  "@type": "BreadcrumbList",
                  itemListElement: [
                    {
                      "@type": "ListItem",
                      position: 1,
                      name: "Home",
                      item: new URL("/", window.location.origin).href,

                      name: document.title.replace(

                      item: canonical,
